spring.application.name=hoop-3x3-backend
server.port=3001

# Segreti (password DB, JWT, chiave Groq, admin) in env.properties: non versionato, vedi env.properties.example
spring.config.import=optional:file:env.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/hoop3x3
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Le tabelle si creano con db/schema.sql (pgAdmin): Hibernate controlla solo che le entity combacino
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
# Durata del JWT di accesso: breve, perché il client lo rinnova con il refresh token. Sotto i 3 minuti il
# client rinnoverebbe a ogni richiesta (rinnova in anticipo quando mancano meno di 2 minuti alla scadenza)
jwt.durata-minuti=30
# Refresh token (cookie httpOnly hoop3x3_refresh): durata e flag Secure (true in produzione con HTTPS)
auth.refresh-giorni=30
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Coach AI (proxy Groq). Vuoto = Coach disattivato, il resto dell'app funziona
groq.api.key=${GROQ_API_KEY:}
# Modello Groq: llama-3.3-70b-versatile è stato dismesso; gpt-oss-120b supporta il tool calling
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Origini frontend ammesse. Servono anche passando dal proxy di Vite o da un reverse proxy: il backend riceve
# l'Origin del browser e risponde 403 alle POST/PUT/PATCH/DELETE delle origini non elencate
cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173

# Admin iniziale (creato al primo avvio se non esiste)
seed.admin.email=${ADMIN_EMAIL:}
seed.admin.password=${ADMIN_PASSWORD:}
# Dati di prova (circuito Estathé 2025: anagrafe, lega con 4 tappe, archivio) intestati all'admin.
# Inseriti una sola volta: al secondo avvio il runner li trova e non fa nulla
seed.demo=${SEED_DEMO:false}

# Corpo di /error senza stack trace; il messaggio resta
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always
