spring.application.name=hoop-3x3-backend
# Render (e gli altri hosting) assegnano la porta con PORT; in locale resta la 3001
server.port=${PORT:3001}

# Segreti (password DB, JWT, chiave Groq, admin) in env.properties: non versionato, vedi env.properties.example
spring.config.import=optional:file:env.properties

# Host, porta e nome del database: in locale valgono i default, su Render arrivano dal database collegato
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hoop3x3}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Le tabelle si creano con db/schema.sql (pgAdmin): Hibernate controlla solo che le entity combacino
spring.jpa.hibernate.ddl-auto=validate
# DB_INIT_MODE=always esegue db/schema.sql a ogni avvio, prima del controllo di Hibernate: serve dove pgAdmin non
# c'è (Render). È sicuro perché lo schema è tutto IF NOT EXISTS e non tocca i dati. Di default è spento
spring.sql.init.mode=${DB_INIT_MODE:never}
spring.sql.init.schema-locations=file:db/schema.sql
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Secret dei JWT: obbligatorio, di almeno 32 caratteri e diverso dal valore d'esempio, altrimenti il server non
# parte (JwtProperties). Chi cambia il secret invalida i token già emessi: basta rifare il login.
# Il «:» finale fa valere una JWT_SECRET non definita come vuota, e il server lo dice; senza, il segnaposto
# resterebbe come testo del secret e l'errore parlerebbe solo di lunghezza
jwt.secret=${JWT_SECRET:}
# Durata del JWT di accesso, da 5 a 1440 minuti (30 se manca): breve, perché il client lo rinnova con il refresh
# token. Il minimo evita che il client rinnovi a ogni richiesta (rinnova in anticipo quando mancano meno di
# 2 minuti alla scadenza)
jwt.durata-minuti=30
# Refresh token (cookie httpOnly hoop3x3_refresh): durata e flag Secure (true in produzione con HTTPS)
auth.refresh-giorni=30
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Coach AI (proxy Groq). Vuoto = Coach disattivato, il resto dell'app funziona
groq.api.key=${GROQ_API_KEY:}
# Modello Groq: llama-3.3-70b-versatile è stato dismesso; gpt-oss-120b supporta il tool calling
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# Origini frontend ammesse (CORS_ORIGINS in env.properties, separate da virgola). Servono anche dietro un
# proxy: il backend confronta l'Origin del browser con schema, host e porta che vede lui (il proxy di Vite
# riscrive l'host, un reverse proxy che termina HTTPS cambia lo schema) e, se non coincidono e l'origine non
# è elencata, risponde 403 alle POST/PUT/PATCH/DELETE
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# Admin iniziale (creato al primo avvio se non esiste)
seed.admin.email=${ADMIN_EMAIL:}
seed.admin.password=${ADMIN_PASSWORD:}
# Dati di prova (circuito Estathé 2025: anagrafe, lega con 4 tappe, archivio) intestati all'admin.
# Inseriti una sola volta: al secondo avvio il runner li trova e non fa nulla
seed.demo=${SEED_DEMO:false}

# Corpo di /error (gli errori che non passano da ExceptionsHandler, per esempio quelli del container) senza
# stack trace e senza il testo dell'eccezione, che può contenere dettagli interni: gli errori dell'app
# rispondono già con il loro {message, timestamp}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# L'API accetta solo JSON. Il FormContentFilter di Spring leggerebbe per intero i corpi
# application/x-www-form-urlencoded di PUT, PATCH e DELETE prima della sicurezza e del limite dei 2 MB
spring.mvc.formcontent.filter.enabled=false

# Java 25: ogni richiesta gira su un thread virtuale, così una chiamata lenta (per esempio verso Groq)
# non tiene occupato un thread di sistema. Per tornare ai thread tradizionali basta togliere la riga
spring.threads.virtual.enabled=true
