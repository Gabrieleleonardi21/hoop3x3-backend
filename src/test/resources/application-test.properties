# Profilo «test» dei test di integrazione (classi *IT, ./mvnw verify -Pintegrazione).
# Il database è sempre uno di prova, mai hoop3x3: lo sceglie TestDiIntegrazione (hoop3x3_test oppure TEST_DB_URL)
# e prima di ogni test svuota.sql cancella tutte le righe.

# Lo schema lo creano le migrazioni di Flyway (src/main/resources/db/migration) all'avvio dei test: su un database di
# prova vuoto, come quello della CI, i test provano le stesse migrazioni che girano sul server vero e non una copia
# dello schema. Hibernate controlla solo che le entity combacino con le tabelle

# Limiti di frequenza alti: gli IT fanno più accessi insieme dallo stesso indirizzo (RefreshTokenIT ne fa 8 per test) e
# con i valori di produzione (10 al minuto) verrebbero respinti con 429. I test che provano il limite stesso scelgono da sé
# valori bassi e usano un orologio che si sposta a comando
limite.auth-al-minuto=100000
limite.coach-al-minuto=100000
limite.coach-al-giorno=1000000
limite.foglio-al-minuto=100000
limite.foglio-al-giorno=1000000

# Nessun admin e nessun dato di prova all'avvio; secret fittizio, valido solo per i test
seed.admin.email=
seed.admin.password=
seed.demo=false
seed.campetti=false
jwt.secret=segreto-dei-test-di-integrazione-di-almeno-32-caratteri
groq.api.key=
# Lettura dei fogli spenta e nessuna chiave Anthropic. Questo file da solo non basta: le variabili esportate nel terminale
# (AI_LETTORE_FOGLIO, GROQ_API_KEY, ANTHROPIC_API_KEY) prevalgono sui file, quindi le stesse tre proprietà vuote stanno anche
# in TestDiIntegrazione, che prevale su di loro (FornitoriSpentiIT). Gli adattatori si provano con GroqFinto e AnthropicFinto
ai.lettore-foglio=
anthropic.api.key=
# Nessuna email vera dai test, anche se BREVO_API_KEY o MAIL_USERNAME sono esportate nel terminale: chi prova il recupero
# password registra un EmailSender finto (EmailFinto)
app.brevo.api-key=
app.mail.mittente=
