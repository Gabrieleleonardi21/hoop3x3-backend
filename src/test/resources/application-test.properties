# Profilo «test» dei test di integrazione (classi *IT, ./mvnw verify -Pintegrazione).
# Il database è sempre uno di prova, mai hoop3x3: prima di ogni test svuota.sql cancella tutte le righe.
# Di default hoop3x3_test sul PostgreSQL locale (createdb hoop3x3_test); TEST_DB_URL ne indica un altro, per esempio in CI
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/hoop3x3_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}

# Lo schema lo crea db/schema.sql all'avvio dei test (è tutto IF NOT EXISTS); Hibernate controlla solo che combaci
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:db/schema.sql

# Nessun admin e nessun dato di prova all'avvio; secret fittizio, valido solo per i test
seed.admin.email=
seed.admin.password=
seed.demo=false
jwt.secret=segreto-dei-test-di-integrazione-di-almeno-32-caratteri
groq.api.key=
