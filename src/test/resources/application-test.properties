# Profilo «test» dei test di integrazione (classi *IT, ./mvnw verify -Pintegrazione).
# Il database è sempre uno di prova, mai hoop3x3: lo sceglie TestDiIntegrazione (hoop3x3_test oppure TEST_DB_URL)
# e prima di ogni test svuota.sql cancella tutte le righe.

# Lo schema lo creano le migrazioni di Flyway (src/main/resources/db/migration) all'avvio dei test: su un database di
# prova vuoto, come quello della CI, i test provano le stesse migrazioni che girano sul server vero e non una copia
# dello schema. Hibernate controlla solo che le entity combacino con le tabelle

# Nessun admin e nessun dato di prova all'avvio; secret fittizio, valido solo per i test
seed.admin.email=
seed.admin.password=
seed.demo=false
jwt.secret=segreto-dei-test-di-integrazione-di-almeno-32-caratteri
groq.api.key=
